# --- Idle lock / manual lock (append this block into ~/.config/sway/config) ---
# Requires: swayidle, gtklock (see gtklock/config.ini and gtklock/style.css in this repo)

# Manual lock keybind
bindsym $mod+Shift+x exec gtklock

# Auto-lock on idle, screen off, and before sleep
exec swayidle -w \
    timeout 300 'gtklock -d' \
    timeout 600 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep 'gtklock -d'
