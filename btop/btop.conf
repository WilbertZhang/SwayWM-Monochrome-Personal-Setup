### --- BTOP CONFIG: matches another-monochrome-sway rice --- ###
### Repo path: btop/btop.conf  ->  install to: ~/.config/btop/btop.conf

color_theme = "monochrome"
theme_background = False
truecolor = True
force_tty = False
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000

proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True

cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
show_coretemp = True
temp_scale = "celsius"
clock_format = "%H:%M"
background_update = True

mem_graphs = True
show_swap = True
show_disks = True
only_physical = True
show_io_stat = True

net_download = 100
net_upload = 100
net_auto = True
net_sync = True

show_battery = True
vim_keys = False
log_level = "WARNING"

# --- MESSAGE: Numbers in the dark, still readable. ---
