# --- Autostart monitoring/eyecandy windows on boot ---
# Loaded via `include` from sway/config. Do NOT paste this into your config.# Paste this block by hand into ~/.config/sway/config.
# fastfetch normally prints once and exits, so it is wrapped in a shell
# that stays open (sh -c 'fastfetch; exec $SHELL') so the window persists.
# cmatrix has no config file — its look is set entirely by CLI flags;
# -C only accepts named ANSI colors (no hex), "white" is the closest
# match to this rice's grayscale palette.

for_window [app_id="^fastfetch$"] floating enable, resize set 30 ppt 35 ppt, move position 2 ppt 4 ppt
for_window [app_id="^btop$"]      floating enable, resize set 35 ppt 45 ppt, move position 50 ppt 4 ppt
for_window [app_id="^cava$"]      floating enable, resize set 45 ppt 25 ppt, move position 2 ppt 50 ppt
for_window [app_id="^cmatrix$"]   floating enable, resize set 40 ppt 25 ppt, move position 55 ppt 55 ppt

exec alacritty --class fastfetch -e sh -c 'export FASTFETCH_SHOWN=1; fastfetch; exec "$SHELL"'
exec alacritty --class btop -e btop
exec alacritty --class cava -e sh -c 'sleep 2; exec cava'
exec alacritty --class cmatrix -e cmatrix -C white

# --- MESSAGE: Four windows watching, one system breathing. ---
