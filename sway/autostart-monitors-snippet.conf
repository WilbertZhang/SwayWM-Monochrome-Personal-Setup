# --- Autostart monitoring/eyecandy windows on boot ---
# NOT auto-loaded by sway (same reasoning as idle-lock-snippet.conf).
# Paste this block by hand into ~/.config/sway/config.
#
# fastfetch normally prints once and exits, so it is wrapped in a shell
# that stays open (sh -c 'fastfetch; exec $SHELL') so the window persists.
# cmatrix has no config file — its look is set entirely by CLI flags;
# -C only accepts named ANSI colors (no hex), "white" is the closest
# match to this rice's grayscale palette.

exec alacritty --class fastfetch,fastfetch -e sh -c 'export FASTFETCH_SHOWN=1; fastfetch; exec "$SHELL"'
exec alacritty --class btop,btop -e btop
exec alacritty --class cava,cava -e cava
exec alacritty --class cmatrix,cmatrix -e cmatrix -C white

for_window [app_id="^fastfetch$"] floating enable, resize set 600 400, move position 50 50
for_window [app_id="^btop$"]      floating enable, resize set 700 500, move position 700 50
for_window [app_id="^cava$"]      floating enable, resize set 700 300, move position 50 560
for_window [app_id="^cmatrix$"]   floating enable, resize set 700 300, move position 760 600

# --- MESSAGE: Four windows watching, one system breathing. ---
